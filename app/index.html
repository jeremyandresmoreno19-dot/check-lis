<title>Check-Lis Taller</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: app de una columna para celular, barra azul de ficha arriba y pestañas abajo (diseño de los mockups aprobados). Panel y reportes se abren a lo ancho en computador. Tema claro único, como la ficha impresa. */
:root{
  color-scheme:light;
  --bg:#eef1f6; --card:#ffffff; --ink:#141a26; --muted:#647089; --line:#dde2ec; --field:#f4f6fa;
  --brand:#002a4a; --brand-2:#001c33; --brand-soft:#e2eaf1; --sub:#b9cde0; --link:#0b4f86;
  --hv:#ee8600; --hv-ink:#1a0e00;
  --ok:#1f8a4c; --ok-soft:#e2f3e9; --bad:#c62f2f; --bad-soft:#fbe5e5; --warn-ink:#8a6100; --warn-soft:#fff4d6;
  --na:#7b8496; --na-soft:#eceef2; --oos:#141a26;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--brand)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--hv);outline-offset:2px}
.mono{font-family:var(--f-mono)}
.lbl{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.muted{color:var(--muted)}
.small{font-size:.86rem}
h2,h3{margin:0;font-family:var(--f-display);font-weight:700;letter-spacing:.01em;line-height:1.1}
h2{font-size:1.3rem} h3{font-size:1.12rem}
p{margin:0}

.shell{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.shell.wide{max-width:1200px}

/* Barra superior */
.ab{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand);color:#fff;padding-block:12px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ab-row{display:flex;align-items:center;gap:10px}
.ab .t{font-family:var(--f-display);font-size:1.55rem;font-weight:700;letter-spacing:.01em;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab .s{font-size:.84rem;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab .grow{flex:1;min-width:0}
.ab .mark{width:38px;height:38px;flex:none;display:block}
.ab .mark img{width:100%;height:100%;object-fit:contain;display:block}
.ib{width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.13);color:#fff;display:grid;place-items:center;flex:none;transition:transform .12s var(--ease),background .15s}
.ib:active{transform:scale(.92);background:rgba(255,255,255,.22)}
.ib svg{width:20px;height:20px}
.sync{font-family:var(--f-mono);font-size:10px;color:var(--sub);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:#46c27c;flex:none}
.sync.busy i{background:var(--hv);animation:blink 1s infinite}
.sync.off i{background:#ff7a6b}
.sync.pulse i{animation:pulse .8s var(--ease)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(70,194,124,.9)}100%{box-shadow:0 0 0 9px rgba(70,194,124,0)}}
@keyframes blink{50%{opacity:.35}}
@media (max-width:380px){.sync span{display:none}}
.prog{height:6px;border-radius:3px;background:rgba(255,255,255,.25);margin-top:10px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--hv);border-radius:3px;transition:width .5s var(--ease)}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:8px}
.steps button{border:0;background:none;padding:2px 0;color:var(--sub);font-size:.74rem;font-weight:600;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps button.now{color:#fff}
.steps button:disabled{opacity:.5;cursor:default}

main{flex:1;padding-block:14px 130px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
main.enter{animation:enter .3s var(--ease)}
main.back{animation:enterB .3s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@keyframes enterB{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 13px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row>.tag{flex:none}
.stack{display:flex;flex-direction:column;gap:8px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpis.k4{grid-template-columns:repeat(4,1fr)}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center;min-width:0}
.kpi b{display:block;font-family:var(--f-display);font-size:2rem;line-height:1;font-weight:700}
.kpi .lbl{font-size:9.5px;display:block;margin-top:4px;line-height:1.25}
.kpi.alert b{color:var(--bad)}
@media (min-width:900px){.shell.wide .kpis{grid-template-columns:repeat(5,1fr)}}
@media (max-width:380px){.kpis.k4{grid-template-columns:repeat(2,1fr)}}

/* Placa, etiquetas */
.plate{display:inline-block;font-family:var(--f-mono);font-weight:700;background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:4px;padding:1px 7px;font-size:.88rem;letter-spacing:.05em;white-space:nowrap;line-height:1.35}
.plate.lg{font-size:1.25rem;padding:2px 10px}
.tag{display:inline-flex;align-items:center;font-size:.76rem;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;line-height:1.25}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.warn{background:var(--warn-soft);color:var(--warn-ink)} .tag.na{background:var(--na-soft);color:var(--muted)} .tag.info{background:var(--brand-soft);color:var(--brand)}
.tag.oos{background:var(--oos);color:#fff;border-radius:4px;padding-left:20px;position:relative;overflow:hidden}
.tag.oos::before{content:"";position:absolute;left:0;top:0;bottom:0;width:13px;background:repeating-linear-gradient(-45deg,var(--hv) 0 4px,var(--oos) 4px 8px)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:.84rem;font-weight:600;white-space:nowrap;transition:background .15s,color .15s,transform .1s}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip:active{transform:scale(.95)}

/* Tarjetas de equipo */
.eqc{display:flex;flex-direction:column;gap:5px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;text-align:left;width:100%;transition:transform .12s var(--ease)}
.eqc:active{transform:scale(.985)}
.eqc .v{font-weight:600}
.eqc .d{color:var(--muted);font-size:.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eqc.oos{border-left:5px solid var(--oos)}
.mini{height:4px;border-radius:2px;background:var(--na-soft);overflow:hidden;margin-top:3px}
.mini b{display:block;height:100%;background:var(--brand);border-radius:2px}
.mini.anim b{animation:growx .7s var(--ease) both;transform-origin:left}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* Botones */
.btn{position:relative;overflow:hidden;border:0;border-radius:10px;padding:13px 16px;font-weight:600;font-size:.98rem;background:var(--brand);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s var(--ease),filter .15s;text-align:center;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--brand);box-shadow:inset 0 0 0 1.5px var(--brand)}
.btn.hv{background:var(--hv);color:var(--hv-ink);font-weight:700}
.btn.danger{background:var(--bad)}
.btn.wa{background:#1f9d55}
.btn.block{width:100%}
.btn.sm{padding:8px 11px;font-size:.86rem;border-radius:8px}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn svg{width:18px;height:18px;flex:none}
.btn.loading{pointer-events:none;filter:saturate(.7)}
.btn.loading::after{content:"";position:absolute;left:0;bottom:0;height:4px;background:var(--hv);animation:load 2.5s var(--ease) forwards}
@keyframes load{from{width:0}to{width:92%}}
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.22;transform:scale(0);animation:rip .55s var(--ease) forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}
.link{border:0;background:none;color:var(--link);font-weight:600;padding:4px 0;text-decoration:underline;text-underline-offset:3px;text-align:left}
.fab{position:fixed;z-index:15;right:max(16px,calc((100vw - 560px)/2 + 16px));bottom:calc(80px + env(safe-area-inset-bottom,0px));border-radius:14px;padding:14px 18px;box-shadow:0 10px 22px -10px rgba(120,80,0,.7);font-size:1rem}

/* Campos (estilo mockup: etiqueta dentro de la caja) */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.grid3{display:grid;grid-template-columns:1.25fr 1.25fr 1fr;gap:7px}
.full{grid-column:1/-1}
.fld{background:var(--field);border:1px solid var(--line);border-radius:8px;padding:6px 9px 7px;min-width:0;transition:border-color .15s,background .15s,box-shadow .15s;position:relative}
.fld:focus-within{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px var(--brand-soft)}
.fld .lbl{display:block;margin-bottom:1px}
.fld input,.fld textarea,.fld select{display:block;width:100%;border:0;background:transparent;padding:2px 0;font-size:1rem;font-weight:600;outline:none;min-width:0}
.fld input::placeholder,.fld textarea::placeholder{color:#aab2c1;font-weight:400}
.fld textarea{font-weight:400;resize:vertical;min-height:56px;line-height:1.35}
.fld.ta{padding-right:44px}
.fld.err{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.hint{font-size:.8rem;margin-top:3px;color:var(--muted)}
.hint .ok,.ok-t{color:var(--ok)} .hint .bad,.bad-t{color:var(--bad)} .hint .warn{color:var(--warn-ink)}
.auto{font-size:.72rem;font-weight:600;color:var(--ok);background:var(--ok-soft);padding:2px 8px;border-radius:999px}
.mic{position:absolute;right:6px;top:6px;width:34px;height:34px;border-radius:50%;border:0;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}
.mic svg{width:17px;height:17px}
.mic.rec{background:var(--bad);color:#fff;animation:pulseR 1.2s infinite}
@keyframes pulseR{0%{box-shadow:0 0 0 0 rgba(198,47,47,.6)}100%{box-shadow:0 0 0 10px rgba(198,47,47,0)}}
@media (max-width:400px){.grid3{grid-template-columns:1fr 1fr}.grid3 .fld:nth-child(3){grid-column:1/-1}}
.check{display:flex;gap:10px;align-items:flex-start;padding:4px 0;font-weight:500}
.check input{width:22px;height:22px;accent-color:var(--brand);flex:none;margin-top:1px}

/* Avisos */
.banner{border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;font-size:.9rem}
.banner b{display:block}
.banner.bad{background:var(--bad-soft);color:#7d1717}
.banner.warn{background:var(--warn-soft);color:#5c4100}
.banner.info{background:var(--brand-soft);color:var(--brand-2)}
.banner.oos{background:var(--oos);color:#fff;position:relative;padding-left:24px;overflow:hidden}
.banner.oos::before{content:"";position:absolute;left:0;top:0;bottom:0;width:12px;background:repeating-linear-gradient(-45deg,var(--hv) 0 5px,var(--oos) 5px 10px)}
.banner .btn{margin-top:6px}

/* Checklist */
.sec{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sec-h{width:100%;border:0;background:none;display:flex;align-items:center;gap:10px;padding:10px 12px;text-align:left}
.sec-h .nm{flex:1;min-width:0;font-family:var(--f-display);font-weight:700;font-size:1.02rem;letter-spacing:.03em;text-transform:uppercase}
.ring{width:32px;height:32px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3.5}
.ring .bg{stroke:var(--na-soft)}
.ring .fg{stroke:var(--ok);stroke-linecap:round;transition:stroke-dashoffset .5s var(--ease)}
.ring.bad .fg{stroke:var(--bad)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mono);font-size:8.5px;font-weight:700}
.chev{width:18px;height:18px;color:var(--muted);transition:transform .25s var(--ease)}
.sec.open .chev{transform:rotate(180deg)}
.sec-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s var(--ease)}
.sec.open .sec-b{grid-template-rows:1fr}
.sec-b>div{overflow:hidden}
.sec-in{padding:0 12px 6px}
.who{font-size:.74rem;font-weight:600;color:var(--brand);background:var(--brand-soft);padding:2px 8px;border-radius:999px;white-space:nowrap}
.colh{display:flex;justify-content:flex-end;padding:2px 0 4px;border-top:1px solid var(--line)}
.colh span{width:44px;margin-left:4px;text-align:center;font-family:var(--f-mono);font-size:9.5px;color:var(--muted)}
.it{border-top:1px solid var(--line);padding:7px 0}
.it-r{display:flex;align-items:center;gap:8px}
.it-n{flex:1;min-width:0}
.bm{display:flex;gap:4px;flex:none}
.bm button{width:44px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-family:var(--f-mono);font-weight:700;font-size:.78rem;color:var(--muted);transition:background .15s,border-color .15s,color .15s,transform .1s}
.bm button:active{transform:scale(.88)}
.it[data-v="B"] .bm [data-v="B"]{background:var(--ok);border-color:var(--ok);color:#fff}
.it[data-v="M"] .bm [data-v="M"]{background:var(--bad);border-color:var(--bad);color:#fff}
.it[data-v="NA"] .bm [data-v="NA"]{background:var(--na);border-color:var(--na);color:#fff}
.bm button.pop{animation:pop .32s var(--spring)}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.it-d{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s var(--ease)}
.it[data-v="M"] .it-d{grid-template-rows:1fr}
.it-d>div{overflow:hidden}
.fail{margin-top:7px;background:var(--bad-soft);border:1px solid #f0bcbc;border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px}
.fail .h{font-weight:700;color:var(--bad);font-size:.84rem}
.fail .fld{background:#fff}
.fail.err{animation:shake .35s;border-color:var(--bad);box-shadow:0 0 0 3px rgba(198,47,47,.25)}
.photos{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.photos .ph{position:relative}
.photos img{width:56px;height:46px;object-fit:cover;border-radius:6px;display:block;background:repeating-linear-gradient(135deg,#c9ced9 0 6px,#d9dde6 6px 12px)}
.photos .ph button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:.72rem}
.addph{position:relative;width:56px;height:46px;border-radius:6px;border:1.5px dashed var(--bad);display:grid;place-items:center;color:var(--bad);font-size:.68rem;font-weight:700;text-align:center;line-height:1.05;background:#fff;cursor:pointer;overflow:hidden}
.addph input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0;width:100%;height:100%}
.addph.busy{border-style:solid;color:var(--muted)}
.opt{font-size:.76rem;color:var(--muted)}
.add-it{display:flex;gap:6px;padding:8px 0 4px;border-top:1px solid var(--line)}
.add-it input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--field)}
.rm{border:0;background:none;color:var(--muted);width:28px;height:28px;border-radius:50%;flex:none}
.tbd{font-size:.86rem;color:var(--muted);padding:8px 0;border-top:1px solid var(--line)}
.secfoot{padding:7px 0 3px;border-top:1px solid var(--line);display:flex;justify-content:flex-end}

/* Cierre */
.outs{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.out{position:relative;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px;transition:all .15s;overflow:hidden}
.out:active{transform:scale(.97)}
.out strong{font-weight:700}
.out span{font-size:.76rem;color:var(--muted);line-height:1.2}
.out.on[data-v="conforme"]{border-color:var(--ok);background:var(--ok);color:#fff}
.out.on[data-v="no_conforme"]{border-color:var(--bad);background:var(--bad);color:#fff}
.out.on[data-v="pendiente"]{border-color:var(--hv);background:var(--warn-soft)}
.out.on[data-v="fuera"]{border-color:var(--oos);background:var(--oos);color:#fff}
.out.on span{color:inherit;opacity:.85}
.out[data-v="fuera"]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:repeating-linear-gradient(-45deg,var(--hv) 0 6px,var(--oos) 6px 12px);opacity:.3}
.out.on[data-v="fuera"]::after{opacity:1}
.sigbox{height:96px;border:1.5px dashed var(--muted);border-radius:10px;background:#fff;position:relative;display:flex;align-items:center;justify-content:center;width:100%;color:var(--muted);font-weight:600;gap:8px;transition:border-color .2s}
.sigbox svg{width:20px;height:20px}
.sigbox img{position:absolute;inset:6px 6px 22px;width:calc(100% - 12px);height:calc(100% - 28px);object-fit:contain}
.sigbox .w{position:absolute;left:10px;bottom:4px;font-size:.74rem;color:var(--muted);font-weight:500}
.sigbox.done{border-style:solid;border-color:var(--ok)}
.sigbox.done .w{color:var(--ok);font-weight:700}
.sigbox.err{border-color:var(--bad);animation:shake .35s}

/* Firma a pantalla completa */
.sigov{position:fixed;inset:0;z-index:60;background:#fff;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:up .28s var(--ease)}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sigov .top{background:var(--brand);color:#fff;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px}
.sigov .top .grow{flex:1;min-width:0}
.sigov .top b{font-family:var(--f-display);font-size:1.4rem;display:block}
.sigov .top span{font-size:.85rem;color:var(--sub)}
.sigov .area{flex:1;position:relative;background:#fff;touch-action:none}
.sigov canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.sigov .line{position:absolute;left:8%;right:8%;bottom:28%;border-bottom:2px solid #c5ccd8;pointer-events:none}
.sigov .x{position:absolute;left:8%;bottom:calc(28% + 6px);font-family:var(--f-display);font-size:2rem;color:#c5ccd8;pointer-events:none}
.sigov .ph{position:absolute;left:0;right:0;bottom:calc(28% - 30px);text-align:center;color:#9aa3b2;font-size:.9rem;pointer-events:none;transition:opacity .2s}
.sigov.drawn .ph{opacity:0}
.sigov .bot{display:flex;gap:8px;padding:10px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line)}
.sigov .bot .btn{flex:1}
.sigov .bot .btn.ghost{flex:0 0 auto}
.rot{font-size:.78rem;color:var(--muted);text-align:center;padding:6px 0 0}
@media (orientation:landscape){.rot{display:none}}

/* Barra inferior */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.dock-in{max-width:560px;margin:0 auto;padding-top:9px;padding-bottom:10px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));display:flex;gap:8px}
.dock-in .btn{flex:1}
.dock-in .btn.ghost{flex:0 0 auto}
.tabs{display:flex;max-width:560px;margin:0 auto;padding:6px max(6px,env(safe-area-inset-right,0px)) 8px max(6px,env(safe-area-inset-left,0px))}
.tab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.72rem;color:var(--muted);padding:4px 2px;position:relative;transition:color .15s}
.tab i{width:30px;height:26px;border-radius:8px;display:grid;place-items:center;transition:background .2s,transform .1s}
.tab svg{width:20px;height:20px}
.tab.on{color:var(--brand);font-weight:700}
.tab.on i{background:var(--brand-soft)}
.tab:active i{transform:scale(.9)}

/* Documento (vista en app) */
.dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px}
.dl div{min-width:0}
.dl .v{font-weight:600;overflow-wrap:anywhere}
.marks{display:flex;flex-direction:column}
.mrow{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-top:1px solid var(--line);font-size:.92rem}
.mrow:first-child{border-top:0}
.mk{font-family:var(--f-mono);font-weight:700;font-size:.74rem;padding:2px 7px;border-radius:4px;color:#fff;flex:none;align-self:flex-start}
.mk.B{background:var(--ok)} .mk.M{background:var(--bad)} .mk.NA{background:var(--na)} .mk.x{background:var(--na-soft);color:var(--muted)}
.stamp{display:inline-block;border:3px solid currentColor;border-radius:8px;padding:4px 12px;font-family:var(--f-display);font-weight:700;font-size:1.25rem;letter-spacing:.04em;transform:rotate(-4deg);white-space:nowrap}
.stamp.ok{color:var(--ok)} .stamp.bad{color:var(--bad)} .stamp.warn{color:#a66c00} .stamp.oos{color:var(--oos)}
.stamp.anim{animation:stamp .5s var(--spring)}
@keyframes stamp{from{transform:rotate(-4deg) scale(2.2);opacity:0}to{transform:rotate(-4deg) scale(1);opacity:1}}
.anx{border-left:3px solid var(--hv);padding:4px 0 4px 10px;font-size:.9rem}

/* Hoja imprimible (vista previa PDF) */
.pp-fit{width:100%;overflow:hidden;border-radius:6px;box-shadow:0 10px 30px -14px rgba(10,30,80,.45);background:#fff}
.paper{width:794px;background:#fff;color:#141a26;font-family:var(--f-body);font-size:12.5px;line-height:1.35;transform-origin:top left}
.pp-h{background:#002a4a;color:#fff;padding:22px 30px 18px;display:flex;justify-content:space-between;align-items:center;gap:20px}
.pp-h h1{margin:0;font-family:var(--f-body);font-weight:700;font-size:21px;letter-spacing:.01em}
.pp-h p{margin:4px 0 0;color:#b9cde0;font-size:12.5px}
.pp-h img{width:74px;height:74px;background:#fff;padding:4px;border-radius:4px}
.pp-h img.lg{width:190px;height:auto;background:none;padding:0;border-radius:0}
.pp-h{border-bottom:5px solid #ee8600}
.pp-h .r{display:flex;gap:14px;align-items:center}
.pp-b{padding:16px 30px 26px}
.pp-b h2{font-family:var(--f-body);font-size:13.5px;font-weight:700;color:#002a4a;margin:14px 0 6px;letter-spacing:.02em}
.pp-kv{display:grid;grid-template-columns:1fr 1fr;gap:5px 26px}
.pp-kv div{display:grid;grid-template-columns:128px 1fr;gap:6px;align-items:end}
.pp-kv b{font-weight:700}
.pp-kv span{border-bottom:1px solid #8a93a5;min-height:17px;padding:0 2px}
.pp-t{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
.pp-t th:not(:first-child){width:92px}
.pp-t th{background:#002a4a;color:#fff;font-weight:700;font-size:10.5px;padding:6px 10px;text-align:center;letter-spacing:.03em}
.pp-t th:first-child{text-align:left}
.pp-t td{padding:4px 10px;border-bottom:1px solid #e3e7ee;text-align:center}
.pp-t td:first-child{text-align:left}
.pp-t tr:nth-child(even) td{background:#f4f7fc}
.pp-t tr.sub td{background:#e2eaf1;font-weight:700;color:#002a4a;font-size:11px;letter-spacing:.03em}
.pp-t tr.nt td{background:#fbe5e5;color:#7d1717;text-align:left;font-size:11px}
.bx{display:inline-grid;place-items:center;width:15px;height:15px;border:1px solid #555;font-weight:700;font-size:11px;line-height:1;background:#fff;vertical-align:middle}
.pp-box{border:1px solid #c9ced9;min-height:30px;padding:5px 8px;white-space:pre-wrap}
.pp-sig{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:20px}
.pp-sig>div{text-align:center;font-size:11px;color:#5a6478}
.pp-sig img{height:64px;max-width:100%;object-fit:contain;display:block;margin:0 auto}
.pp-sig .ln{border-top:1px solid #141a26;padding-top:4px;color:#141a26}
.pp-sig .em{height:64px}
.pp-out{display:flex;gap:22px;flex-wrap:wrap;margin-top:4px}
.pp-out span{display:inline-flex;gap:6px;align-items:center;font-weight:600}
.pp-foot{margin-top:14px;font-size:11px;color:#5a6478;display:flex;justify-content:space-between}

/* Panel, reportes */
.panel{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@media (min-width:900px){.shell.wide .panel{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:.88rem;min-width:620px}
table.t th{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);font-weight:500}
table.t td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tbody tr{cursor:pointer;transition:background .15s}
table.t tbody tr:hover{background:var(--field)}
.bar{display:inline-block;width:80px;height:6px;background:var(--na-soft);border-radius:3px;overflow:hidden;vertical-align:middle;margin-right:6px}
.bar b{display:block;height:100%;background:var(--brand)}
.feed>div{display:grid;grid-template-columns:44px 1fr;gap:6px;padding:7px 0;border-top:1px solid var(--line);font-size:.88rem}
.feed>div:first-child{border-top:0}
.feed .tm{font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}
.hb{display:grid;grid-template-columns:minmax(0,150px) 1fr 34px;gap:8px;align-items:center;font-size:.88rem;padding:3px 0}
.hb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb i{height:10px;background:var(--na-soft);border-radius:5px;overflow:hidden}
.hb i b{display:block;height:100%;background:var(--bad);border-radius:5px}
.hb i b.br{background:var(--brand)}
.hb strong{text-align:right;font-family:var(--f-mono);font-size:.8rem}
.live{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:blink 2s infinite}
.qr{display:flex;gap:14px;align-items:center}
.qr img{width:120px;height:120px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:6px;flex:none}
.confirm{background:var(--bad-soft);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.confirm .row .btn{flex:1}
.person{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.person:first-child{border-top:0}
.person .grow{flex:1;min-width:0}
.person select{border:1px solid var(--line);border-radius:8px;padding:7px;background:var(--field)}
.tpl{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid var(--line);gap:10px}
.sw{position:relative;width:44px;height:26px;flex:none}
.sw input{opacity:0;width:100%;height:100%;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:13px;background:var(--line);transition:background .2s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s var(--ease)}
.sw input:checked+i{background:var(--na)}
.sw input:checked+i::after{transform:translateX(18px)}
.empty{text-align:center;padding:30px 18px;display:flex;flex-direction:column;gap:8px;align-items:center;background:var(--card);border:1.5px dashed var(--line);border-radius:12px}
.skel{height:74px;border-radius:12px;background:linear-gradient(90deg,#e6eaf1 0%,#f4f6fa 50%,#e6eaf1 100%);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.note{font-size:.84rem;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}

/* Toast, splash */
.toast{position:fixed;z-index:70;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;background:var(--ink);color:#fff;padding:11px 15px;border-radius:12px;font-weight:600;font-size:.92rem;width:max-content;max-width:min(92vw,460px);transition:all .28s var(--ease);pointer-events:none;display:flex;gap:9px;align-items:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--bad)}
.toast i{width:18px;height:18px;border-radius:50%;background:var(--ok);display:grid;place-items:center;font-size:.7rem;flex:none;font-style:normal}
.splash{position:fixed;inset:0;z-index:80;background:var(--brand);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .4s var(--ease),visibility .4s}
.splash.gone{opacity:0;visibility:hidden}
.splash img{width:min(300px,74vw);height:auto}
.splash .m{font-family:var(--f-display);font-weight:700;font-size:1.6rem;letter-spacing:.04em;margin-top:-4px}
.splash .m span{color:var(--hv)}
.splash .tr{width:210px;height:6px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden}
.splash .tr b{display:block;height:100%;width:0;background:repeating-linear-gradient(-45deg,var(--hv) 0 8px,#d99500 8px 16px);animation:fill 1.1s var(--ease) forwards}
@keyframes fill{to{width:100%}}
.splash p{font-size:.9rem;color:var(--sub)}
.tape{height:9px;background:repeating-linear-gradient(-45deg,var(--hv) 0 12px,var(--oos) 12px 24px);border-radius:2px}
.login{max-width:460px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:14px;padding-block:30px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login .brand{display:flex;flex-direction:column;gap:6px}
.login .brand img{width:min(320px,100%);height:auto;display:block}
.login .brand span{font-family:var(--f-display);font-weight:700;font-size:1.5rem;color:var(--brand);letter-spacing:.03em}
.seg2{display:flex;gap:6px;flex-wrap:wrap}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

function write(path,patch,o){o=o||{};if(St.mode==='local'){saveLocal();return}
 if(!St.canWrite)return;
 const q=Q[path]=Q[path]||{patch:null,t:0,busy:false,set:false};
 if(o.set)q.set=true;q.patch=q.patch?deepMerge(q.patch,patch):clone(patch);
 clearTimeout(q.t);q.t=setTimeout(()=>flush(path),o.now?0:450);updSync()}
async function flush(path){const q=Q[path];if(!q||!q.patch||q.busy)return;const p=q.patch,setIt=q.set;q.patch=null;q.set=false;q.busy=true;q.sent=p;St.inflight++;updSync();
 const ref=DB.doc(path);
 try{if(setIt){const full=docOf(path);await ref.set(clone(full||p))}else await ref.update(p)}
 catch(e){const c=e&&e.code;
  if(c==='invalid_argument'&&!setIt){try{const full=docOf(path);await ref.set(clone(full||p))}catch(e2){dbFail(e2)}}
  else if(c==='unavailable'||c==='resource_exhausted'){q.patch=q.patch?deepMerge(clone(p),q.patch):p;q.set=q.set||setIt;setTimeout(()=>flush(path),1500+Math.random()*2000)}
  else dbFail(e)}
 finally{q.busy=false;q.recent=Date.now()+4000;St.inflight--;updSync();if(q.patch)flush(path);else flashSync();setTimeout(()=>{if(!q.busy&&!q.patch&&q.recent<=Date.now())q.sent=null},4500)}}
function dbFail(e){const c=e&&e.code;if(c==='quota_exceeded')toast('El almacenamiento compartido está lleno. Pide al administrador borrar datos de ejemplo.','bad');else if(c==='invalid_argument'){St.canWrite=false;toast('Tu acceso es de solo lectura. Pide acceso de colaborador para registrar fichas.','bad');scheduleRender(true)}else if(c==='revoked'){St.canWrite=false}else toast('No se pudo guardar un cambio. Se reintentará al reconectar.','bad')}

function compress(file,max,q){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*s));c.height=Math.max(1,Math.round(img.naturalHeight*s));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q||.62))};img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('decode'))};img.src=url})}

/* Si un día terminó sin entrega del supervisor, se arma el recopilado igual y queda marcado sin firma */
function autoEntregas(){if(!isSup()||!St.canWrite)return;const today=dayKey(Date.now());const days=new Set();Object.values(St.fichas).forEach(f=>{days.add(dayKey(f.creado));if(f.cierre)days.add(dayKey(f.cierre))});
 days.forEach(d=>{if(d>=today||St.entregas[d])return;const list=dayFichas(d);const e={fecha:d,firmado:false,auto:true,t:Date.now(),resumen:resumen(list),fichas:list.map(f=>f.id),nota:'Generada automáticamente: el turno no se entregó.'};St.entregas[d]=e;write('entregas/'+d,e,{set:true})})}

let lastSig='',lastView='',pendingRender=false;
function typing(){const a=document.activeElement;return a&&app.contains(a)&&(a.tagName==='TEXTAREA'||(a.tagName==='INPUT'&&!['checkbox','radio','file'].includes(a.type))||a.tagName==='SELECT')}
function viewSig(){if(ui.view==='ficha'||ui.view==='ver'||ui.view==='preview')return stable([ui.view,ui.step,St.fichas[ui.fid]||null,St.canWrite,ui.confirm]);return stable([ui.view,ui.filter,ui.pview,St.fichas,St.equipos,St.entregas,St.cfg,St.personas,ui.ek,ui.confirm,St.canWrite])}
function scheduleRender(force){if(ui.sig||typing()){pendingRender=true;return}if(!force&&viewSig()===lastSig)return;render()}
document.addEventListener('focusout',()=>setTimeout(()=>{if(pendingRender&&!typing()&&!ui.sig){pendingRender=false;scheduleRender()}},150));

function render(){pendingRender=false;const ae=document.activeElement&&app.contains(document.activeElement)?document.activeElement.id:'';
 if(!St.ready){app.innerHTML=`<div class="shell">${bar('Taller','Conectando con el taller')}<main>${St.slow?'<div class="banner warn"><div><b>Los datos aún no llegan</b>Revisa la señal. La app sigue intentando.</div></div>':''}<div class="skel"></div><div class="skel"></div><div class="skel"></div></main></div>`;return}
 let v=ui.view;if(v==='login'){app.innerHTML=vLogin();return}if(v==='perfil'){app.innerHTML=vPerfil();return}
 const m=me();const f=St.fichas[ui.fid];
 if((v==='ficha'||v==='ver'||v==='preview')&&!f){v=ui.view='inicio'}
 if(v==='ficha'&&(f.estado==='cerrada'||!canCreate())){v=ui.view='ver'}
 const sub=m?`Turno ${m.turno} · ${m.nombre} (${ROLES[role()]})`:'Solo lectura';
 let top='',body='',dock='',fab='',wide=false;
 if(v==='inicio'){top=bar(role()==='operador'?'Estado de equipos':'Taller',sub,{gear:!!m});body=role()==='operador'?vOperador():vInicio();dock=tabs();if(canCreate())fab=`<button class="btn hv fab" data-act="new">+ Nuevo ingreso</button>`}
 else if(v==='ficha'){top=bar(f.equipo.equipo||'Nuevo ingreso',`Paso ${ui.step+1} de 5 · ${STEPS[ui.step]}`,{back:true,extra:`<div class="prog"><i style="width:${(ui.step+1)*20}%"></i></div>`+stepsNav(f)});body=vStep(f);dock=wizDock(f)}
 else if(v==='ver'){top=bar('Ficha '+eqLabel(f.equipo),(f.equipo.equipo+' '+f.equipo.marca).trim(),{back:true});body=vVer(f);dock=`<div class="dock-in"><button class="btn ghost" data-act="home">Inicio</button>${f.estado==='cerrada'?`<button class="btn" data-act="preview">${I.pdf} Vista previa y compartir</button>`:(canCreate()?'<button class="btn" data-act="resume">Continuar ficha</button>':'')}</div>`}
 else if(v==='preview'){top=bar('Vista previa','Ficha '+eqLabel(f.equipo),{back:true,backTo:'ver'});body=vPreview(f);dock=shareDock(f)}
 else if(v==='equipos'){top=bar('Equipos',sub,{gear:!!m});body=vEquipos();dock=tabs()}
 else if(v==='equipo'){const e=St.equipos[ui.ek];top=bar(e?e.equipo:'Equipo',e?(e.marca+' '+e.modelo):'',{back:true,backTo:'equipos'});body=vEquipo(e);dock=e&&canCreate()?`<div class="dock-in"><button class="btn hv" data-act="new-eq" data-k="${esc(e.key)}">+ Nuevo ingreso de este equipo</button></div>`:tabs()}
 else if(v==='escanear'){top=bar('Escanear',sub,{gear:!!m});body=vEscanear();dock=tabs()}
 else if(v==='turno'){top=bar('Entrega de turno',`Turno ${St.cfg.turnoActivo} · ${fecha(Date.now())}`,{gear:!!m});body=vTurno();dock=tabs()}
 else if(v==='panel'){wide=true;top=bar('Panel del taller','Vista del supervisor',{gear:!!m});body=vPanel();dock=tabs()}
 else if(v==='ajustes'){top=bar('Ajustes',sub,{back:true});body=vAjustes();dock=tabs()}
 const anim=ui.dir>0?'enter':ui.dir<0?'back':'';const key=v+ui.step+ui.fid+ui.ek;const changed=lastView!==key;
 app.innerHTML=`<div class="shell${wide?' wide':''}">${top}<main class="${anim}">${body}</main></div><nav class="dock">${dock}</nav>${fab}`;
 ui.dir=0;lastView=key;lastSig=viewSig();
 if(changed)$$('.mini').forEach(x=>x.classList.add('anim'));
 if(ae){const n=document.getElementById(ae);if(n&&n.focus)n.focus({preventScroll:true})}
 hydrate();updSync();
 if(v==='preview')fitPaper();
 if(v==='equipo')drawQR();
}
function bar(t,s,o){o=o||{};return `<header class="ab"><div class="ab-row">${o.back?`<button class="ib" data-act="go" data-v="${o.backTo||'inicio'}" aria-label="Volver">${I.back}</button>`:`<span class="mark"><img src="${LOGO.gearInv}" alt="Mantenimiento Industrial"></span>`}<div class="grow"><div class="t">${esc(t)}</div><div class="s">${esc(s)}</div></div><div class="sync"><i></i><span>${esc(syncText())}</span></div>${o.gear?`<button class="ib" data-act="go" data-v="ajustes" aria-label="Ajustes">${I.gear}</button>`:''}</div>${o.extra||''}</header>`}
function tabs(){const r=role();let t=[['inicio','Inicio',I.home],['equipos','Equipos',I.eq],['escanear','Escanear',I.scan],['turno','Turno',I.turno]];if(r==='operador')t=[['inicio','Inicio',I.home],['escanear','Escanear',I.scan]];if(isSup())t.push(['panel','Panel',I.panel]);const cur=ui.view==='equipo'?'equipos':ui.view;return `<div class="tabs">${t.map(x=>`<button class="tab${cur===x[0]?' on':''}" data-act="go" data-v="${x[0]}"><i>${x[2]}</i>${x[1]}</button>`).join('')}</div>`}

function banners(){const out=[];
 if(!St.canWrite&&St.mode==='db')out.push('<div class="banner warn"><div><b>Solo lectura</b>Puedes ver todo, pero no registrar fichas.</div></div>');
 if(isSup()){const oos=Object.values(St.equipos).filter(e=>e.estado==='fuera');if(oos.length)out.push(`<div class="banner oos"><div><b>${oos.length} ${oos.length===1?'equipo fuera de servicio':'equipos fuera de servicio'}</b>${oos.map(e=>esc(eqLabel(e))+' '+esc(e.equipo)).join(', ')}</div></div>`);
  const today=dayKey(Date.now());const hm=(St.cfg.horaTermino||'19:00').split(':').map(Number);const d=new Date();const late=d.getHours()*60+d.getMinutes()>=hm[0]*60+(hm[1]||0);const ent=St.entregas[today];
  if(late&&!(ent&&ent.firmado)&&dayFichas(today).length)out.push(`<div class="banner warn"><div><b>Falta entregar el turno de hoy</b>Son las ${hhmm(Date.now())} y la jornada termina a las ${esc(St.cfg.horaTermino)}.<br>${ui.view!=='turno'?'<button class="btn sm" data-act="go" data-v="turno">Ir a entrega de turno</button>':''}</div></div>`)}
 return out.join('')}
function vInicio(){const fs=Object.values(St.fichas);const today=dayKey(Date.now());const open=fs.filter(f=>f.estado!=='cerrada');
 const k={taller:open.length,espera:open.filter(f=>f.espera).length,ent:fs.filter(f=>f.estado==='cerrada'&&f.cierre&&dayKey(f.cierre)===today&&f.salida==='conforme').length};
 const F={abiertas:f=>f.estado!=='cerrada',mias:f=>f.mecanico.uid===myId()&&(f.estado!=='cerrada'||dayKey(f.cierre||0)===today),hoy:f=>f.estado==='cerrada'&&dayKey(f.cierre||0)===today,todas:()=>true};
 const list=fs.filter(F[ui.filter]||F.abiertas).sort((a,b)=>(a.estado==='cerrada')-(b.estado==='cerrada')||b.act-a.act);

<span class="lbl" style="margin-top:4px">Equipos</span>

async function paperCanvas(html){await load('h2c');const host=document.createElement('div');host.style.cssText='position:fixed;left:-10000px;top:0;width:794px;background:#fff';host.innerHTML=html;document.body.appendChild(host);
 try{await Promise.all($$('img[data-foto]',host).map(im=>getFoto(im.dataset.foto).then(d=>{if(d)im.src=d;else im.remove()})));
 await Promise.all($$('img',host).map(im=>im.complete&&im.naturalWidth?0:new Promise(r=>{im.onload=im.onerror=r})));
 try{if(document.fonts&&document.fonts.ready)await document.fonts.ready}catch(e){}
 return await html2canvas(host.firstElementChild,{scale:2,backgroundColor:'#ffffff',logging:false})}finally{host.remove()}}
async function canvasToPdf(c){await load('pdf');const pdf=new window.jspdf.jsPDF('p','pt','a4');const W=595.28,H=841.89;const ph=Math.floor(c.width*H/W);let y=0,first=true;
 while(y<c.height){const h=Math.min(ph,c.height-y);const part=document.createElement('canvas');part.width=c.width;part.height=h;const x=part.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,h);x.drawImage(c,0,y,c.width,h,0,0,c.width,h);if(!first)pdf.addPage();pdf.addImage(part.toDataURL('image/jpeg',.9),'JPEG',0,0,W,h*W/c.width);first=false;y+=h}
 return pdf.output('blob')}

async function decodeQR(file){await load('jsqr');const url=URL.createObjectURL(file);try{const img=await new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=url});
 for(const max of [1200,800,1800]){const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);const d=x.getImageData(0,0,c.width,c.height);const r=jsQR(d.data,c.width,c.height,{inversionAttempts:'attemptBoth'});if(r)return r.data}
 return null}finally{URL.revokeObjectURL(url)}}

<section class="card"><span class="lbl">Plantillas por tipo de equipo</span><p class="small muted" style="margin:4px 0 8px">Activa los ítems que no aplican a ese tipo. Se marcan N/A solos en sus fichas.</p>
<div class="fld"><label class="lbl" for="tp-t">Tipo de equipo</label><input id="tp-t" data-tpl value="${esc(tp)}" list="dl-tp" placeholder="Mini cargador"><datalist id="dl-tp">${tipos.map(t=>`<option value="${esc(t)}">`).join('')}</datalist></div>
${tp?`<div style="margin-top:6px">${allKeys(tf).map(k=>`<label class="tpl"><span class="small">${esc(nameOf(tf,k))} <span class="muted">(${esc(secOf(k))})</span></span><span class="sw"><input type="checkbox" data-tplk="${k}" ${tpl.na.includes(k)?'checked':''} aria-label="No aplica: ${esc(nameOf(tf,k))}"><i></i></span></label>`).join('')}</div>`:''}</section>

<section class="card stack"><span class="lbl">Datos de prueba</span><p class="small muted">Carga equipos y fichas de ejemplo para probar. Quedan marcados como ejemplo y se pueden borrar.</p>${ui.confirm==='wipe'?`<div class="confirm"><b>¿Borrar todos los datos de ejemplo?</b><div class="row"><button class="btn ghost" data-act="cancel">Cancelar</button><button class="btn danger" data-act="wipe">Borrar</button></div></div>`:`<div class="row"><button class="btn ghost" style="flex:1" data-act="seed">Cargar ejemplos</button><button class="btn ghost" style="flex:1;color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad)" data-act="ask-wipe">Borrar ejemplos</button></div>`}</section>`:''}
<p class="note">${St.mode==='db'?'Los datos se comparten en vivo entre todos los que abren esta app. Si no hay señal, quedan guardados en el celular y se suben al volver.':'Vista sin conexión al servidor: los datos quedan solo en este dispositivo.'}</p>`}

/* ============ Firma a pantalla completa ============ */
function openSig(title,name,done){ui.sig={done};const ov=$('#ov');ov.innerHTML=`<div class="sigov" role="dialog" aria-label="Firma"><div class="top"><div class="grow"><b>Firma</b><span>${esc(title)}${name?': '+esc(name):''}</span></div><button class="ib" data-act="sig-cancel" aria-label="Cerrar">✕</button></div><div class="area"><canvas></canvas><span class="x">✕</span><div class="line"></div><div class="ph">Firma sobre la línea con el dedo</div></div><div class="rot">Gira el celular para tener más espacio</div><div class="bot"><button class="btn ghost" data-act="sig-clear">Borrar</button><button class="btn" data-act="sig-save">Guardar firma</button></div></div>`;
 document.body.style.overflow='hidden';const root=$('.sigov'),wrap=$('.area',root),cv=$('canvas',wrap);let ctx,drawn=false;
 const size=()=>{const r=wrap.getBoundingClientRect(),d=devicePixelRatio||1;const old=drawn?cv.toDataURL():null;cv.width=Math.max(1,r.width*d);cv.height=Math.max(1,r.height*d);ctx=cv.getContext('2d');ctx.scale(d,d);ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#13306e';ctx.fillStyle='#13306e';if(old){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,r.width,r.height);im.src=old}};
 size();ui.sig.resize=size;addEventListener('resize',size);
 let dn=false,last=null,w=3,bx=[1e9,1e9,-1e9,-1e9];const pt=e=>{const b=cv.getBoundingClientRect();const p={x:e.clientX-b.left,y:e.clientY-b.top,t:performance.now()};bx=[Math.min(bx[0],p.x),Math.min(bx[1],p.y),Math.max(bx[2],p.x),Math.max(bx[3],p.y)];return p};
 cv.addEventListener('pointerdown',e=>{e.preventDefault();dn=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}last=pt(e);ctx.beginPath();ctx.arc(last.x,last.y,1.4,0,7);ctx.fill();if(!drawn){drawn=true;root.classList.add('drawn');buzz(8)}});
 cv.addEventListener('pointermove',e=>{if(!dn)return;const p=pt(e);const v=Math.hypot(p.x-last.x,p.y-last.y)/Math.max(1,p.t-last.t);w=w*.65+Math.max(1.6,Math.min(4.2,4.4-v*1.6))*.35;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p});
 const up=()=>{dn=false};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
 ui.sig.clear=()=>{ctx.clearRect(0,0,cv.width,cv.height);drawn=false;bx=[1e9,1e9,-1e9,-1e9];root.classList.remove('drawn')};
 /* Recorta el espacio vacío alrededor de los trazos para que la firma se vea grande en la ficha */
 ui.sig.get=()=>{if(!drawn)return null;const d=devicePixelRatio||1,padd=14;const x0=Math.max(0,(bx[0]-padd)*d),y0=Math.max(0,(bx[1]-padd)*d),x1=Math.min(cv.width,(bx[2]+padd)*d),y1=Math.min(cv.height,(bx[3]+padd)*d);const sw=Math.max(1,x1-x0),sh=Math.max(1,y1-y0);const s=Math.min(1,640/sw);const o=document.createElement('canvas');o.width=Math.max(1,Math.round(sw*s));o.height=Math.max(1,Math.round(sh*s));o.getContext('2d').drawImage(cv,x0,y0,sw,sh,0,0,o.width,o.height);return o.toDataURL('image/png')}}
function closeSig(){if(ui.sig)removeEventListener('resize',ui.sig.resize);$('#ov').innerHTML='';document.body.style.overflow='';ui.sig=null;if(pendingRender)scheduleRender()}

/* ============ Toast ============ */
